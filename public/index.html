<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Search</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="searchScene" aria-hidden="true"></canvas>
    <div id="cursorGlow" aria-hidden="true"></div>

    <main class="app">
      <nav class="topbar" aria-label="Product">
        <div class="brand-row">
          <span class="brand-mark">S</span>
          <span class="brand-name">Smart Search</span>
        </div>
      </nav>

      <section class="hero" aria-label="Smart search">
        <div class="hero-copy">
          <span class="eyebrow">AI-powered search</span>
          <h1>Search anything. Understand faster.</h1>
          <p>
            Smart Search turns public sources into a clear answer, with evidence
            ready when you need it.
          </p>
        </div>

        <form id="searchForm" class="search-form">
          <label for="queryInput" class="sr-only">Search query</label>
          <button
            id="attachButton"
            class="attach-button"
            type="button"
            aria-expanded="false"
            aria-controls="attachMenu"
            aria-label="Attach files"
          >
            +
          </button>
          <div id="attachMenu" class="attach-menu" hidden>
            <button type="button" data-accept="image/*">
              <span>Photo</span>
              <small>Images and screenshots</small>
            </button>
            <button type="button" data-accept="video/*">
              <span>Video</span>
              <small>Clips and recordings</small>
            </button>
            <button type="button" data-accept=".pdf,.doc,.docx">
              <span>Document</span>
              <small>PDF, DOC, DOCX</small>
            </button>
            <button type="button" data-accept=".txt,.md,.csv,.json,text/plain,text/markdown,text/csv,application/json">
              <span>Data / Text</span>
              <small>TXT, MD, CSV, JSON</small>
            </button>
          </div>
          <input
            id="fileInput"
            class="file-input"
            type="file"
            multiple
            accept="image/*,video/*,.pdf,.doc,.docx,.txt,.md,.csv,.json"
          />
          <input
            id="queryInput"
            name="q"
            type="search"
            autocomplete="off"
            placeholder="Search a topic or company..."
            required
          />
          <button type="submit">Search</button>
        </form>

        <div id="attachmentTray" class="attachment-tray" hidden></div>

        <div class="quick-search-row" id="quickSearchRow">
          <div class="quick-searches" aria-label="Quick searches">
            <button type="button" data-query="future of artificial intelligence">Future of AI</button>
            <button type="button" data-query="climate technology trends">Climate tech</button>
            <button type="button" data-query="space exploration companies">Space companies</button>
          </div>
          <button
            class="quick-clear"
            id="quickClear"
            type="button"
            aria-label="Hide quick searches"
          >
            x
          </button>
        </div>
      </section>

      <section id="status" class="status" hidden></section>

      <section id="historySection" class="history-section result-surface" hidden>
        <div class="section-heading">
          <h2>Recent Searches</h2>
          <button id="historyClear" class="history-clear" type="button">Clear</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <section id="answerSection" class="answer-section result-surface" hidden>
        <div class="section-heading">
          <h2>AI Answer</h2>
          <span id="providerBadge"></span>
        </div>
        <div id="answerText" class="answer-text"></div>
      </section>

      <section id="relatedSection" class="related-section result-surface" hidden>
        <h2>Related Questions</h2>
        <div id="relatedQuestions" class="related-list"></div>
      </section>

      <section id="resultsSection" class="results-section result-surface" hidden>
        <div class="section-heading">
          <h2>Ranked Sources</h2>
          <span id="resultCount"></span>
        </div>
        <div id="resultsList" class="results-list"></div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/scene.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
